<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>ragbox</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    max-width: 640px;
    margin: 3rem auto;
    padding: 0 1rem;
    line-height: 1.5;
  }
  h1 { font-size: 1.4rem; }
  form { display: flex; gap: 0.5rem; margin: 1.5rem 0; }
  input {
    flex: 1;
    padding: 0.6rem 0.8rem;
    font-size: 1rem;
    border: 1px solid #8888;
    border-radius: 6px;
  }
  button {
    padding: 0.6rem 1.2rem;
    font-size: 1rem;
    border: none;
    border-radius: 6px;
    background: #2563eb;
    color: white;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: default; }
  #answer { white-space: pre-wrap; margin-top: 1rem; }
  #sources { margin-top: 0.75rem; font-size: 0.9rem; opacity: 0.75; }
  .hidden { display: none; }
  #examples { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.75rem; }
  .example-chip {
    padding: 0.35rem 0.7rem;
    font-size: 0.85rem;
    border: 1px solid #8888;
    border-radius: 999px;
    background: transparent;
    color: inherit;
    cursor: pointer;
  }
  .example-chip:hover { background: #8882; }
</style>
</head>
<body>
  <h1>ragbox: ask your documents</h1>
  <p>Ask a question about whatever was ingested into Qdrant. No documents ingested yet? Run <code>./scripts/ingest_samples.sh</code> first, or try one of these on the bundled sample docs:</p>

  <div id="examples">
    <button type="button" class="example-chip">What is Qdrant?</button>
    <button type="button" class="example-chip">Why does RAG avoid fine-tuning?</button>
    <button type="button" class="example-chip">What is PagedAttention?</button>
  </div>

  <form id="ask-form">
    <input id="question" type="text" placeholder="Ask your own question..." autocomplete="off" required />
    <button id="submit" type="submit">Ask</button>
  </form>

  <div id="answer"></div>
  <div id="sources" class="hidden"></div>

  <script>
    const form = document.getElementById("ask-form");
    const questionInput = document.getElementById("question");
    const answerEl = document.getElementById("answer");
    const sourcesEl = document.getElementById("sources");
    const submitBtn = document.getElementById("submit");

    document.querySelectorAll(".example-chip").forEach((chip) => {
      chip.addEventListener("click", () => {
        questionInput.value = chip.textContent;
        form.requestSubmit();
      });
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const question = questionInput.value.trim();
      if (!question) return;

      submitBtn.disabled = true;
      answerEl.textContent = "Thinking…";
      sourcesEl.classList.add("hidden");

      try {
        const response = await fetch("/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question }),
        });
        if (!response.ok) throw new Error(`Request failed: ${response.status}`);
        const data = await response.json();

        answerEl.textContent = data.answer;
        if (data.sources && data.sources.length) {
          sourcesEl.textContent = "Sources: " + data.sources.join(", ");
          sourcesEl.classList.remove("hidden");
        }
      } catch (err) {
        answerEl.textContent = "Something went wrong: " + err.message;
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
